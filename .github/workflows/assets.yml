name: Récupérer les ressources Poly Haven

# Télécharge les modèles et textures CC0 listés dans assets/manifest.json et les enregistre dans le
# dépôt (assets/polyhaven/), pour que le jeu, les tests et les versions les embarquent.
# Se lance à la main (onglet Actions) ou quand le manifeste change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/manifest.json', 'tools/fetch_polyhaven.py', '.github/workflows/assets.yml']

permissions:
  contents: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement
        run: |
          python3 -u tools/fetch_polyhaven.py 2>&1 | tee /tmp/fetch.log
          echo "exit=${PIPESTATUS[0]}" >> /tmp/fetch.log
      - name: Enregistrement dans le dépôt
        run: |
          set -x
          {
            git config user.name "alize-assets"
            git config user.email "assets@alize.local"
            du -sh assets/polyhaven || true
            find assets/polyhaven -type f -size +90M -printf 'TROP GROS : %p (%s octets)\n' || true
            git add assets/polyhaven
            if git diff --cached --quiet; then
              echo "Rien de nouveau."
            else
              git commit -q -m "Ressources Poly Haven (CC0) : mise à jour depuis le manifeste"
              git pull --rebase -q origin main
              git push origin HEAD:main
              echo "Ressources enregistrées : $(git rev-parse --short HEAD)"
            fi
          } 2>&1 | tee -a /tmp/fetch.log
          exit "${PIPESTATUS[0]}"
      - name: Journal (branche ci-logs, lisible depuis l'atelier de Claude)
        if: always()
        run: |
          # Commit fabriqué avec les commandes de plomberie : on ne touche jamais à l'arbre de travail.
          blob=$(git hash-object -w /tmp/fetch.log)
          tree=$(printf '100644 blob %s\tfetch-assets.log\n' "$blob" | git mktree)
          commit=$(GIT_AUTHOR_NAME=alize-assets GIT_AUTHOR_EMAIL=assets@alize.local \
                   GIT_COMMITTER_NAME=alize-assets GIT_COMMITTER_EMAIL=assets@alize.local \
                   git commit-tree "$tree" -m "journal du téléchargement des ressources")
          git push -f origin "$commit:refs/heads/ci-logs"
