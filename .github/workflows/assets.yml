name: Récupérer les ressources Poly Haven

# Télécharge les modèles et textures CC0 listés dans assets/manifest.json et les enregistre dans le
# dépôt (assets/polyhaven/), pour que le jeu, les tests et les versions les embarquent.
# Se lance à la main (onglet Actions) ou quand le manifeste change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/manifest.json', 'tools/fetch_polyhaven.py']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement
        run: |
          python3 -u tools/fetch_polyhaven.py 2>&1 | tee fetch.log
          echo "exit=${PIPESTATUS[0]}" >> fetch.log
      - name: Journal (branche ci-logs, lisible depuis l'atelier de Claude)
        if: always()
        run: |
          git config user.name "alize-assets"
          git config user.email "assets@alize.local"
          mkdir -p /tmp/cilog && cp fetch.log /tmp/cilog/fetch-assets.log
          git stash -u -q || true
          git checkout -q --orphan ci-logs
          git rm -rfq . || true
          cp /tmp/cilog/fetch-assets.log .
          git add fetch-assets.log
          git commit -qm "journal du téléchargement des ressources"
          git push -f origin ci-logs
          git checkout -q main
          git stash pop -q || true
      - name: Enregistrement dans le dépôt
        run: |
          git add assets/polyhaven
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Ressources Poly Haven (CC0) : mise à jour depuis le manifeste"
            git push origin main
          fi
